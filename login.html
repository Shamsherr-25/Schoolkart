<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - SchoolKart</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page">
<header class="header"><div class="container nav"><a href="index.html" class="logo">🎒 SchoolKart</a><button class="menu-btn" onclick="toggleMenu()">☰</button><nav id="mainNav"><a href="index.html">Home</a><a href="schools.html">Schools</a><a href="products.html">Products</a><a href="cart.html">Cart <span class="cart-count">0</span></a></nav></div></header>
<main><section class="auth-section"><div class="auth-container">
<div class="auth-logo">🎒</div><h1 id="authTitle">Welcome Back!</h1><p id="authSubtitle">Login to continue shopping.</p>
<form id="loginForm" onsubmit="loginUser(event)">
<div class="form-group"><label>Email or Mobile</label><input type="text" id="loginEmail" placeholder="Enter email or mobile" required></div>
<div class="form-group"><label>Password</label><input type="password" id="loginPassword" placeholder="Enter password" required></div>
<div class="forgot"><a href="#" onclick="forgotPassword(event)">Forgot Password?</a></div>
<button type="submit" class="auth-btn">Login</button></form>
<div class="divider"><span>OR</span></div><button class="google-btn" onclick="demoLogin()">🌐 Continue with Google</button>
<p class="auth-switch">Don't have an account? <button onclick="showSignup()">Create Account</button></p>
<form id="signupForm" class="hidden" onsubmit="signupUser(event)">
<div class="form-group"><label>Full Name</label><input type="text" id="signupName" placeholder="Enter your name" required></div>
<div class="form-group"><label>Mobile Number</label><input type="tel" id="signupMobile" placeholder="Enter mobile number" required></div>
<div class="form-group"><label>Email</label><input type="email" id="signupEmail" placeholder="Enter email" required></div>
<div class="form-group"><label>Password</label><input type="password" id="signupPassword" placeholder="Create password" required></div>
<button type="submit" class="auth-btn">Create Account</button>
<p class="auth-switch">Already have an account? <button type="button" onclick="showLogin()">Login</button></p>
</form>
<p class="demo-note">Demo mode: Any valid-looking login details will work.</p>
</div></section></main>
<script src="app.js"></script>
</body>
</html>
